modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Fixes between mods of the Haven pack. Client: Immersive Portals with Iris shaders on macOS, server list, update
popups, Jade below the notch, pack defaults. Server: Mekanism's block updates reach players under Immersive Portals;
Create schematics keep other mods' block settings and upgrades.
'''

# Targets Immersive Portals, so optional: its plugin applies nothing without it.
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Mekanism's update fix (server side) is about Mekanism and Immersive Portals together.
[[dependencies.${mod_id}]]
    modId="mekanism"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

# The portal fix is about these two; without either it does nothing.
[[dependencies.${mod_id}]]
    modId="immersive_portals_core"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="iris"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
